# Network-boot scenario over IPv6: the rootfs squashfs and the answer file
# are fetched over IPv6, proving the install works on an IPv6 data path.
#
# The PXE firmware boot itself stays IPv4: QEMU's user-mode network has no
# DHCPv6 boot-URL option, so the kernel/initrd still load over IPv4 TFTP. But
# live-boot's fetch= (rootfs) and the installer's live-installer.auto= (answer
# file) both use the IPv6 host (fd00::2), so the part our code owns runs over
# IPv6. A real IPv6 deployment would also PXE-boot over IPv6 (DHCPv6 + HTTP
# boot), which slirp can't emulate.

name: pxe-ipv6-simple
description: Unattended install, BIOS netboot, rootfs + answer file over IPv6

firmware: bios
tpm: false
memory_mb: 8192
cpus: 2
disk_gb: 25

netboot: true
ipv6: true

answer_file: answers/bios-simple.yaml

install_timeout_s: 1800
boot_timeout_s: 300

expect:
  serial_markers:
    - "Automated installation complete"
  failure_markers:
    - "Automated installation FAILED"

ssh:
  user: testuser

verify:
  - name: os-is-lmde
    type: command
    command: ". /etc/os-release && echo $PRETTY_NAME"
    expect_substring: "LMDE"
  - name: hostname-applied
    type: command
    command: hostname
    expect_substring: "lmde-test-01"
  - name: network-manager-running
    type: command
    command: systemctl is-active NetworkManager
    expect_substring: "active"
